ofx_dir: "./ofx"

statements:
  output_dir: "./statements/processed"
  raw:
    - input_dir: "./statements/raw"
      pattern: "^Extras din contul de card.*\\.zip$"
      rename_template: "VB_{year}-{month}-{day}_{iban}.zip"
      zip_password: ${VB_ZIP_PASSWORD}

banks:
  - name: "Victoria Bank"
    filter: "^VB_(?P<year>\\d{4})-(?P<month>\\d{2})-\\d{2}_(?P<iban>.+)\\.zip$"
    zip_password: ${VB_ZIP_PASSWORD}
    accounts:
      - name: "Salary *8585"
        iban: "MD66VI022521100011261MDL"
        currency: MDL
      - name: "Savings *9823"
        iban: "MD65VI225912310310907131"
        currency: MDL
      - name: "Expenses *0101"
        iban: "MD11VI225911508140903004"
        currency: MDL

