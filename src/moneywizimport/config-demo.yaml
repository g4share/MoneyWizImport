statements:
  prepared_dir: "./demo/prepared"
  ofx_dir: "./ofx"
  raw:
    - input_dir: "./demo/raw"
      pattern: "^Extras din contul de card.*\\.zip$"
      rename_template: "VB_{year}-{month}-{day}_{iban}.zip"
      zip_password: ${VB_ZIP_PASSWORD}

providers:
  - name: "Victoria Bank"
    filter: "^VB_(?P<year>\\d{4})-(?P<month>\\d{2})-\\d{2}_(?P<iban>.+)\\.zip$"
    zip_password: ${VB_ZIP_PASSWORD}
    accounts:
      - name: "Salut *8585"
        iban: "MD66VI022521100011261MDL"
      - name: "Salariu *9823"
        iban: "MD65VI225912310310907131"

offline_accounts:
  - name: Revolut
    match:
      - REVOLUT
  - name: Wallet
    match:
      - ATM
      - WITHDRAWAL
      - CASH
      - BANCOMAT
      - NUMERAR

